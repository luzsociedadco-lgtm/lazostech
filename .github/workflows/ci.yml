name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  foundry:
    name: Foundry
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Build
        run: forge build

      - name: Require Solidity tests
        shell: bash
        run: |
          test_count=$(find test -type f -name '*.t.sol' -exec grep -Ehl 'function (test|testFuzz|invariant)' {} + | wc -l)
          if [ "$test_count" -eq 0 ]; then
            echo "No executable Solidity tests were found."
            exit 1
          fi
          echo "Found $test_count Solidity test file(s)."

      - name: Test
        run: forge test -vv

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: lazos-frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_RPC_URL: https://sepolia.base.org
      NEXT_PUBLIC_CHAIN_ID: "84532"
      NEXT_PUBLIC_WALLETCONNECT_ID: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lazos-frontend/package-lock.json

      - name: Mainnet code readiness gate
        run: node ../tools/check-mainnet-readiness.mjs --tier=code

      - name: Install dependencies
        run: npm ci --workspaces=false --legacy-peer-deps

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Typecheck
        run: npm run check-types

      - name: Build
        run: npm run build

